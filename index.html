<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Same family, two files: Devanagari glyphs + Latin punctuation (quotes, dash, ellipsis). */
  @font-face {
    font-family: "Noto Sans Devanagari";
    font-weight: 700;
    font-style: normal;
    src: url("fonts/NotoSansDevanagari-700-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Noto Sans Devanagari";
    font-weight: 700;
    font-style: normal;
    src: url("fonts/NotoSansDevanagari-700-deva.woff2") format("woff2");
    unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF;
  }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import * as T from './tokens.js';
import { createRenderer } from './scene.js';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const r = createRenderer({ ctx, makeCanvas });

window.renderFrame = (t) => r.renderFrame(t);
window.DURATION = T.DURATION;
window.FPS = T.FPS;
window.STILLS = T.STILLS;
window.READY = false;

(async () => {
  const sample = T.STORY.map((c) => c.text).join(' ') + ' रोहन माँ म ०१२३४५६७८९:· ';
  await document.fonts.load(`${T.FONT_WEIGHT} 80px "${T.FONT_FAMILY}"`, sample);
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body>
</html>
