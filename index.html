<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Space Grotesk";
    font-weight: 700;
    font-style: normal;
    src: url("fonts/SpaceGrotesk-700.woff2") format("woff2");
  }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import {
  W, H, FPS, BG, INK, ACCENT, FONT_FAMILY, FONT_WEIGHT, MAX_SIZE, MARGIN, LINE_HEIGHT,
  FADE_IN, RISE, FADE_OUT, TIMELINE, DURATION
} from './tokens.js';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const fontAt = (px) => `${FONT_WEIGHT} ${px}px "${FONT_FAMILY}"`;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);

// ---- layout (deterministic; depends only on constants + loaded font) ----
const maxWidth = W - 2 * MARGIN;
let layout = null;

function widthOf(text, px) { ctx.font = fontAt(px); return ctx.measureText(text).width; }

function buildLayout() {
  // One shared size for every card: largest size where the widest line fits the margins.
  let size = MAX_SIZE;
  const widest = (px) => Math.max(...TIMELINE.cards.map(c => widthOf(c.text, px)));
  while (size > 24 && widest(size) > maxWidth) size -= 1;

  ctx.font = fontAt(size);
  const capH = ctx.measureText('H').actualBoundingBoxAscent;
  const space = ctx.measureText(' ').width;

  const cards = TIMELINE.cards.map(c => {
    const words = c.text.trim().split(/\s+/);
    const widths = words.map(w => widthOf(w, size));
    const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
    let x = (W - total) / 2;
    const parts = words.map((w, k) => {
      const p = { w, x, accent: k === c.accent };
      x += widths[k] + space;
      return p;
    });
    return { parts, total };
  });
  return { size, capH, cards };
}

// ---- the one pure function ----
function renderFrame(t) {
  if (!layout) layout = buildLayout();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  ctx.font = fontAt(layout.size);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';

  for (const c of TIMELINE.cards) {
    const local = t - c.start;
    if (local < 0 || local > FADE_IN + c.hold + FADE_OUT) continue;

    let alpha, dy;
    if (local < FADE_IN) {
      const e = easeOutCubic(clamp01(local / FADE_IN));
      alpha = e; dy = (1 - e) * RISE;
    } else if (local < FADE_IN + c.hold) {
      alpha = 1; dy = 0;
    } else {
      alpha = 1 - clamp01((local - FADE_IN - c.hold) / FADE_OUT); dy = 0;
    }

    const baseline = H / 2 + layout.capH / 2 + dy;
    ctx.globalAlpha = alpha;
    for (const p of layout.cards[c.i].parts) {
      ctx.fillStyle = p.accent ? ACCENT : INK;
      ctx.fillText(p.w, p.x, baseline);
    }
  }
  ctx.globalAlpha = 1;
}

window.renderFrame = renderFrame;
window.DURATION = DURATION;
window.FPS = FPS;
window.CARDS = TIMELINE.cards.map(c => ({ i: c.i, start: c.start, hold: c.hold }));
window.READY = false;

(async () => {
  await document.fonts.load('700 168px "Space Grotesk"');
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body>
</html>
